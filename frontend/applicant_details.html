<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Details | Resume Matcher</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dashboard-body">

    <nav class="navbar glass-nav">
        <div class="container nav-container">
            <div class="logo">ResumeMatcher.ai <span class="badge">Review</span></div>
            <div class="nav-links">
                <a href="#" id="back-link" class="btn btn-secondary">Back to List</a>
            </div>
        </div>
    </nav>

    <div class="container match-report-container">
        <main class="main-content">
            <div class="match-grid-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">

                <!-- Left: Stats & Actions -->
                <div class="match-report-column">
                    <div class="section-header">
                        <h2>Applicant Profile</h2>
                    </div>

                    <div class="card match-summary-card">
                        <div class="match-score-ring" id="score-circle">
                            <span id="score-text">0%</span>
                            <small>Match</small>
                        </div>
                        <div class="match-info">
                            <h3 id="applicant-id">Applicant Name</h3>
                            <p class="company-name" id="status-text">Status: Applied</p>

                            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                                <button id="btn-shortlist" class="btn btn-primary" style="flex: 1;">Shortlist
                                    Candidate</button>
                                <button id="btn-reject" class="btn btn-danger"
                                    style="flex: 1; background: #ef4444; border: none;">Reject</button>
                            </div>
                        </div>
                    </div>

                    <div class="skills-breakdown">
                        <div class="card">
                            <h4>✅ Matched Skills</h4>
                            <div id="matched-skills" class="tags-container"></div>
                        </div>
                        <div class="card">
                            <h4>⚠️ Missing Skills</h4>
                            <div id="missing-skills" class="skills-list"></div>
                        </div>
                    </div>
                </div>

                <!-- Right: Resume Viewer -->
                <div class="resume-viewer-column">
                    <div class="section-header">
                        <h2>Resume Preview</h2>
                    </div>
                    <div class="card" style="height: 800px; padding: 0; overflow: hidden;">
                        <iframe id="resume-frame" src="" width="100%" height="100%" style="border: none;">
                            <p>PDF not supported.</p>
                        </iframe>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
