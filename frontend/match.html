<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Report | Resume Matcher</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="navbar glass-nav">
        <div class="container nav-container">
            <div class="logo">ResumeMatcher.ai <span class="badge">Report</span></div>
            <div class="nav-links">
                <a href="student.html" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container match-report-container">
        <main class="main-content">
            <div class="match-grid-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">

                <!-- Left: Match Report -->
                <div class="match-report-column">
                    <div class="section-header">
                        <h2>Match Report</h2>
                    </div>

                    <div class="card match-summary-card">
                        <div class="match-score-ring" id="score-circle">
                            <span id="score-text">0%</span>
                            <small>Match</small>
                        </div>
                        <div class="match-info">
                            <h3 id="job-title">Job Title</h3>
                            <p class="company-name" id="company-name">Company Name</p>
                            <p class="ai-summary" id="ai-summary">AI Analysis...</p>
                            <button id="btn-apply" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Apply
                                for Job</button>
                        </div>
                    </div>

                    <div class="skills-breakdown">
                        <div class="card">
                            <h4>✅ Matched XML Skills</h4>
                            <!-- "XML" is weird here, probably meant "Extracted"? Keeping generic -->
                            <div id="matched-skills" class="tags-container"></div>
                        </div>
                        <div class="card">
                            <h4>⚠️ Missing Skills & Recommendations</h4>
                            <div id="missing-skills" class="skills-list"></div>
                        </div>
                    </div>
                </div>

                <!-- Right: Resume Viewer -->
                <div class="resume-viewer-column">
                    <div class="section-header">
                        <h2>Your Resume</h2>
                    </div>
                    <div class="card" style="height: 800px; padding: 0; overflow: hidden;">
                        <iframe id="resume-frame" src="" width="100%" height="100%" style="border: none;">
                            <p>Your browser does not support PDFs. <a id="resume-link" href="#">Download the PDF</a>.
                            </p>
                        </iframe>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
